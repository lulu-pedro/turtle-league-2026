<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats — Turtle League 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F9F8F6; color: #333; }

  .nav-menu { display: flex; gap: 4px; align-items: center; }
  .nav-menu a { display: block; text-decoration: none; color: #999; font-size: 13px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 10px; border-bottom: 2px solid transparent; transition: color 0.18s, border-color 0.18s; }
  .nav-menu a:hover { color: #1a472a; border-bottom-color: #1a472a; }
  .nav-menu a.active { color: #1a472a; font-weight: 600; border-bottom-color: #1a472a; }
  .nav-toggle { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: #1a1a1a; padding: 4px 8px; line-height: 1; }

  .tc-orange { color: #d97000; } .tc-blue { color: #0055c8; } .tc-white { color: #555555; } .tc-green { color: #1a8040; }
  tr:hover td { background: #fafaf8; }

  @media (max-width: 768px) {
    .nav-toggle { display: block; }
    .nav-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; flex-direction: column; gap: 0; border-top: 1px solid #eee; box-shadow: 0 6px 20px rgba(0,0,0,0.08); z-index: 99; }
    .nav-menu.open { display: flex; }
    .nav-menu a { padding: 14px 20px; border-bottom: 1px solid #f0f0ee !important; font-size: 14px; }
    .nav-menu a:hover { background: #fafaf8; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header style="position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-bottom: 1px solid #eee; z-index: 100;">
  <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; justify-content: space-between; align-items: center; position: relative;">
    <a href="index.html" style="font-family: 'Young Serif', serif; font-size: 18px; color: #1a1a1a; text-decoration: none; font-style: italic;">🐢 Turtle League</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">☰</button>
    <nav class="nav-menu" id="nav-menu">
      <a href="index.html">About</a>
      <a href="leaderboard.html" class="active">Stats</a>
      <a href="schedule.html">Schedule &amp; RSVP</a>
      <a href="teams.html">Teams</a>
    </nav>
  </div>
</header>

<div style="padding-top: 56px;">

  <!-- PAGE TITLE -->
  <div style="text-align: center; padding: clamp(48px, 6vw, 80px) 24px clamp(32px, 4vw, 48px); background: #F9F8F6;">
    <p style="font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #1a472a; margin-bottom: 20px;">Turtle League 2026</p>
    <h1 style="font-family: 'Young Serif', serif; font-size: clamp(40px, 7vw, 64px); color: #1a1a1a; font-style: italic; line-height: 1;">Stats</h1>
  </div>

  <!-- STANDINGS -->
  <section style="padding: clamp(40px, 5vw, 64px) 24px; background: white; border-top: 1px solid #eee;">
    <div style="max-width: 720px; margin: 0 auto;">
      <h2 style="font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 24px;">Standings</h2>
      <table style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr>
            <th style="text-align: left; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb; width: 32px;"></th>
            <th style="text-align: left; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb;">Team</th>
            <th style="text-align: center; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb; width: 48px;">W</th>
            <th style="text-align: center; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb; width: 48px;">D</th>
            <th style="text-align: center; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb; width: 48px;">L</th>
            <th style="text-align: center; padding: 10px 8px; border-bottom: 2px solid #eee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #bbb; width: 56px;">Pts</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </div>
  </section>

  <!-- GOLDEN BOOT + GOLDEN TEAM -->
  <section style="padding: clamp(40px, 5vw, 64px) 24px; background: #eef5e9;">
    <div style="max-width: 720px; margin: 0 auto;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 40px;">
        <div>
          <h2 style="font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 20px;">Golden Boot</h2>
          <div id="golden-boot"></div>
        </div>
        <div>
          <h2 style="font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 20px;">Golden Team</h2>
          <div id="golden-team"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- MATCH HISTORY -->
  <section style="padding: clamp(40px, 5vw, 64px) 24px; background: white; border-top: 1px solid #eee;">
    <div style="max-width: 720px; margin: 0 auto;">
      <h2 style="font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 24px;">Match History</h2>
      <div id="match-history"></div>
      <div style="margin-top: 28px;">
        <a href="https://docs.google.com/spreadsheets/d/1V_ud7_0gjdWexbr0-ikqerKrBaxNFcA4w_bMrn1VCsU/edit?gid=0#gid=0" target="_blank" style="font-size: 13px; color: #1a472a; text-decoration: none; border-bottom: 1px solid rgba(26,71,42,0.3);">View raw data spreadsheet →</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer style="background: #111; padding: 32px 24px;">
    <div style="max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px;">
      <span style="font-family: 'Young Serif', serif; font-size: 16px; color: #bbb; font-style: italic;">🐢 Turtle League 2026</span>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <a href="index.html" style="color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;">About</a>
        <a href="leaderboard.html" style="color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;">Stats</a>
        <a href="schedule.html" style="color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;">Schedule</a>
        <a href="teams.html" style="color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;">Teams</a>
      </div>
      <span style="font-size: 12px; color: #444;">© 2026 Prospect Park Soccer</span>
    </div>
  </footer>

</div>

<script>
  // ── DATA ──────────────────────────────────────────────────────────────
  var GAME_DATA = [
    { day: 1, t1: "Blue",   t2: "Orange", s1: ["Alma","Em G"],                        s2: [] },
    { day: 1, t1: "White",  t2: "Green",  s1: ["Agustina","Agustina","Paloma (FA)"],  s2: [] },
    { day: 1, t1: "Blue",   t2: "Green",  s1: ["Margaret (FA)","Jane"],               s2: ["Vera"] },
    { day: 1, t1: "Orange", t2: "White",  s1: ["Asya","Olive (FA)"],                  s2: ["Agustina"] },
    { day: 2, t1: "Orange", t2: "Green",  s1: [],                                     s2: ["Vera","Martha"] },
    { day: 2, t1: "Blue",   t2: "White",  s1: ["Mari","Alma","Em G"],                 s2: ["Dulany","Paloma (FA)"] },
    { day: 2, t1: "Blue",   t2: "Orange", s1: ["Em G"],                               s2: ["Alex (FA)"] },
    { day: 2, t1: "White",  t2: "Green",  s1: ["Dulany","Paloma (FA)"],               s2: [] },
  ];

  var CC = { Orange: 'tc-orange', Blue: 'tc-blue', White: 'tc-white', Green: 'tc-green' };

  // ── STANDINGS ─────────────────────────────────────────────────────────
  function getStandings() {
    var s = { Orange:{w:0,d:0,l:0,pts:0,gf:0,ga:0}, Blue:{w:0,d:0,l:0,pts:0,gf:0,ga:0}, White:{w:0,d:0,l:0,pts:0,gf:0,ga:0}, Green:{w:0,d:0,l:0,pts:0,gf:0,ga:0} };
    GAME_DATA.forEach(function(g) {
      var g1 = g.s1.length, g2 = g.s2.length;
      s[g.t1].gf += g1; s[g.t1].ga += g2;
      s[g.t2].gf += g2; s[g.t2].ga += g1;
      if (g1 > g2)      { s[g.t1].w++; s[g.t1].pts += 3; s[g.t2].l++; }
      else if (g2 > g1) { s[g.t2].w++; s[g.t2].pts += 3; s[g.t1].l++; }
      else              { s[g.t1].d++; s[g.t1].pts++; s[g.t2].d++; s[g.t2].pts++; }
    });
    return Object.keys(s).map(function(name) { return Object.assign({name: name}, s[name]); })
      .sort(function(a,b) { return (b.pts - a.pts) || ((b.gf-b.ga) - (a.gf-a.ga)); });
  }

  // ── GOLDEN BOOT ───────────────────────────────────────────────────────
  function getGoldenBoot() {
    var scorers = {};
    GAME_DATA.forEach(function(g) {
      g.s1.concat(g.s2).forEach(function(name) { scorers[name] = (scorers[name] || 0) + 1; });
    });
    return Object.keys(scorers).map(function(name) { return {name: name, goals: scorers[name]}; })
      .sort(function(a,b) { return b.goals - a.goals; });
  }

  // ── GOLDEN TEAM ───────────────────────────────────────────────────────
  function getGoldenTeam() {
    var ts = { Orange:[], Blue:[], White:[], Green:[] };
    GAME_DATA.forEach(function(g) {
      g.s1.forEach(function(n) { if (ts[g.t1].indexOf(n) < 0) ts[g.t1].push(n); });
      g.s2.forEach(function(n) { if (ts[g.t2].indexOf(n) < 0) ts[g.t2].push(n); });
    });
    return Object.keys(ts).map(function(name) { return {name: name, scorers: ts[name]}; })
      .sort(function(a,b) { return b.scorers.length - a.scorers.length; });
  }

  // ── RENDER ────────────────────────────────────────────────────────────
  var standings = getStandings();
  var standingsBody = document.getElementById('standings-body');
  standings.forEach(function(t, i) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;font-size:12px;color:#ccc;">' + (i+1) + '</td>' +
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;"><span class="' + (CC[t.name]||'') + '" style="font-weight:600;font-size:15px;">' + t.name + '</span></td>' +
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;text-align:center;font-size:14px;color:#555;">' + t.w + '</td>' +
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;text-align:center;font-size:14px;color:#555;">' + t.d + '</td>' +
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;text-align:center;font-size:14px;color:#555;">' + t.l + '</td>' +
      '<td style="padding:15px 8px;border-bottom:1px solid #f0f0ee;text-align:center;font-size:18px;font-weight:700;color:#1a1a1a;">' + t.pts + '</td>';
    standingsBody.appendChild(tr);
  });

  var bootEl = document.getElementById('golden-boot');
  getGoldenBoot().forEach(function(s, i) {
    var d = document.createElement('div');
    d.style.cssText = 'display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(26,71,42,0.12);';
    d.innerHTML =
      '<span style="font-size:12px;color:#bbb;width:18px;text-align:right;flex-shrink:0;">' + (i+1) + '</span>' +
      '<span style="flex:1;font-size:14px;color:#333;">' + s.name + '</span>' +
      '<span style="font-size:14px;font-weight:700;color:#1a472a;">' + s.goals + '</span>';
    bootEl.appendChild(d);
  });

  var teamEl = document.getElementById('golden-team');
  getGoldenTeam().forEach(function(t) {
    var d = document.createElement('div');
    d.style.cssText = 'padding:11px 0;border-bottom:1px solid rgba(26,71,42,0.12);';
    d.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;">' +
        '<span class="' + (CC[t.name]||'') + '" style="font-weight:600;font-size:14px;">' + t.name + '</span>' +
        '<span style="font-size:12px;color:#999;">' + t.scorers.length + ' scorers</span>' +
      '</div>' +
      '<div style="font-size:12px;color:#888;line-height:1.5;">' + t.scorers.join(', ') + '</div>';
    teamEl.appendChild(d);
  });

  var histEl = document.getElementById('match-history');
  var sorted = GAME_DATA.slice().sort(function(a,b) { return b.day - a.day; });
  sorted.forEach(function(g) {
    var allScorers = g.s1.map(function(n){return n+' ('+g.t1+')';}).concat(g.s2.map(function(n){return n+' ('+g.t2+')';}));
    var d = document.createElement('div');
    d.style.cssText = 'padding:16px 0;border-bottom:1px solid #f0f0ee;';
    d.innerHTML =
      '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">' +
        '<span style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#bbb;width:60px;flex-shrink:0;">Day ' + g.day + '</span>' +
        '<div style="display:flex;align-items:center;gap:10px;min-width:220px;">' +
          '<span class="' + (CC[g.t1]||'') + '" style="font-weight:600;font-size:14px;">' + g.t1 + '</span>' +
          '<span style="font-size:15px;font-weight:700;color:#1a1a1a;">' + g.s1.length + '–' + g.s2.length + '</span>' +
          '<span class="' + (CC[g.t2]||'') + '" style="font-weight:600;font-size:14px;">' + g.t2 + '</span>' +
        '</div>' +
        '<span style="font-size:12px;color:#aaa;flex:1;min-width:160px;">' + allScorers.join(' · ') + '</span>' +
      '</div>';
    histEl.appendChild(d);
  });

  // ── NAV TOGGLE ────────────────────────────────────────────────────────
  document.getElementById('nav-toggle').addEventListener('click', function() {
    var nav = document.getElementById('nav-menu');
    nav.classList.toggle('open');
  });
</script>
</body>
</html>
