document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"1b73f265-d3ac-4075-bc98-0e2e6619c815\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <style>/* latin-ext */\n@font-face {\n  font-family: 'Young Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d6180f04-4472-40fd-8cd1-039587474864\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Young Serif';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"dd44a812-f6fe-4d94-8baa-9acb62599e80\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F9F8F6; }\n    .nav-menu { display: flex; gap: 4px; align-items: center; }\n    .nav-menu a { display: block; text-decoration: none; color: #999; font-size: 13px; font-weight: 400; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 10px; border-bottom: 2px solid transparent; transition: color 0.18s, border-color 0.18s; }\n    .nav-menu a:hover { color: #1a472a; border-bottom-color: #1a472a; }\n    .nav-menu a.active { color: #1a472a; font-weight: 600; border-bottom-color: #1a472a; }\n    .nav-toggle { display: none; background: none; border: none; font-size: 22px; cursor: pointer; color: #1a1a1a; padding: 4px 8px; line-height: 1; }\n    .tc-orange { color: #d97000; } .tc-blue { color: #0055c8; } .tc-white { color: #555; } .tc-green { color: #1a8040; }\n    .day-normal { border-left: 4px solid #e0e0d8; }\n    .day-playoff { border-left: 4px solid #d97000; }\n    @media (max-width: 768px) {\n      .nav-toggle { display: block; }\n      .nav-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; flex-direction: column; gap: 0; border-top: 1px solid #eee; box-shadow: 0 6px 20px rgba(0,0,0,0.08); z-index: 99; }\n      .nav-menu.open { display: flex; }\n      .nav-menu a { padding: 14px 20px; border-bottom: 1px solid #f0f0ee !important; font-size: 14px; }\n      .nav-menu a:hover { background: #fafaf8; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- HEADER -->\n<header style=\"position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(10px); border-bottom: 1px solid #eee; z-index: 100;\">\n  <div style=\"max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; justify-content: space-between; align-items: center; position: relative;\">\n    <a href=\"index.html\" style=\"font-family: 'Young Serif', serif; font-size: 18px; color: #1a1a1a; text-decoration: none; font-style: italic;\">🐢 Turtle League<\u002Fa>\n    <button class=\"nav-toggle\" onclick=\"{{ toggleMenu }}\" aria-label=\"Open menu\">☰<\u002Fbutton>\n    <nav class=\"{{ navClass }}\">\n      <a href=\"index.html\">About<\u002Fa>\n      <a href=\"leaderboard.html\">Stats<\u002Fa>\n      <a href=\"schedule.html\" class=\"active\">Schedule &amp; RSVP<\u002Fa>\n      <a href=\"teams.html\">Teams<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"padding-top: 56px;\">\n\n  <!-- PAGE TITLE -->\n  <div style=\"text-align: center; padding: clamp(48px, 6vw, 80px) 24px clamp(32px, 4vw, 48px); background: #F9F8F6;\">\n    <p style=\"font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #1a472a; margin-bottom: 20px;\">Turtle League 2026<\u002Fp>\n    <h1 style=\"font-family: 'Young Serif', serif; font-size: clamp(40px, 7vw, 64px); color: #1a1a1a; font-style: italic; line-height: 1;\">Schedule &amp; RSVP<\u002Fh1>\n  <\u002Fdiv>\n\n  <!-- HOUSE RULES -->\n  <section style=\"padding: clamp(40px, 5vw, 64px) 24px; background: white; border-top: 1px solid #eee;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 24px;\">Before you sign up: Our House Rules<\u002Fh2>\n      <ol style=\"margin-left: 20px; display: flex; flex-direction: column; gap: 14px;\">\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">This is a mixed-level league and there are players from various playing backgrounds. We are competitive but kind. This isn't footy league. Bring good energy and respect. Zero tolerance for meanness or aggressive behaviors. If you're spoken to more than three times about your behavior toward others, you will be asked to be on the sideline and possibly sit out from future games.<\u002Fli>\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">Don't hurt each other physically or verbally. Be respectful to your teammates and your opponents. No slide tackles.<\u002Fli>\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">No cleats, no exceptions. Must wear turf shoes or sneakers, nothing with spikes.<\u002Fli>\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">Pause during the game for injuries.<\u002Fli>\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">There are no official goalkeepers in this league. Captains are permitted to dedicate a central defender as a sweeper keeper type role. No hands.<\u002Fli>\n        <li style=\"font-size: 15px; line-height: 1.75; color: #555;\">We self-officiate on the honor system. Captains make the difficult calls.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW TO RSVP -->\n  <section style=\"padding: clamp(40px, 5vw, 64px) 24px; background: #F9F8F6; border-top: 1px solid #eee;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 20px;\">How to RSVP<\u002Fh2>\n\n      <!-- Accordion: Rostered -->\n      <div style=\"border: 1px solid #e8e8e4; border-radius: 8px; margin-bottom: 10px; overflow: hidden;\">\n        <div onclick=\"{{ toggleRoster }}\" style=\"padding: 16px 20px; background: white; cursor: pointer; display: flex; justify-content: space-between; align-items: center;\" style-hover=\"background: #fafaf8;\">\n          <span style=\"font-weight: 500; font-size: 15px; color: #1a1a1a;\">Rostered Players (Signed up for the season)<\u002Fspan>\n          <span style=\"font-size: 13px; color: #aaa; margin-left: 12px;\">{{ rosterArrow }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ rosterOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 20px; border-top: 1px solid #eee; background: white;\">\n            <ol style=\"margin-left: 20px; display: flex; flex-direction: column; gap: 14px;\">\n              <li style=\"font-size: 14px; line-height: 1.7; color: #555;\"><strong style=\"color: #1a1a1a;\">RSVP on Luma on Thursday:<\u002Fstrong> Click the Luma link in your email or use the links below to confirm attendance.<\u002Fli>\n              <li style=\"font-size: 14px; line-height: 1.7; color: #555;\"><strong style=\"color: #1a1a1a;\">Team captains see your status:<\u002Fstrong> Captains will see on Luma who is going or not going.<\u002Fli>\n              <li style=\"font-size: 14px; line-height: 1.7; color: #555;\"><strong style=\"color: #1a1a1a;\">Last-minute drop:<\u002Fstrong> Update your status on Luma and notify your captain + team asap. Laura will see the change on Luma and manage the waitlist.<\u002Fli>\n nd out what team you're assigned to.<\u002Fli>\n            <\u002Fol>\n            <p style=\"margin-top: 16px; font-size: 14px; color: #555; font-style: italic; line-height: 1.7;\"><strong style=\"color: #1a1a1a;\">New to Prospect Park Soccer?<\u002Fstrong> Sign up on Meetup as a member. After your approval, you will be able to RSVP on the Meetup Event.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GAME SCHEDULE -->\n  <section style=\"padding: clamp(40px, 5vw, 64px) 24px; background: white; border-top: 1px solid #eee;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Young Serif', serif; font-size: clamp(20px, 3vw, 26px); color: #1a472a; margin-bottom: 24px;\">Game Schedule<\u002Fh2>\n\n      <!-- Legend -->\n      <div style=\"display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 32px; padding: 14px 16px; background: #F9F8F6; border-radius: 6px;\">\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <div style=\"width: 10px; height: 10px; background: #1a472a; border-radius: 2px; flex-shrink: 0;\"><\u002Fdiv>\n          <span style=\"font-size: 13px; color: #555; font-weight: 500;\">Roster Player RSVP (Luma)<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 8px;\">\n          <div style=\"width: 10px; height: 10px; background: #ff5469; border-radius: 2px; flex-shrink: 0;\"><\u002Fdiv>\n          <span style=\"font-size: 13px; color: #555; font-weight: 500;\">Free Agent RSVP (Meetup)<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Schedule rendered by logic class -->\n      <div>{{ scheduleContent }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background: #111; padding: 32px 24px;\">\n    <div style=\"max-width: 720px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px;\">\n      <span style=\"font-family: 'Young Serif', serif; font-size: 16px; color: #bbb; font-style: italic;\">🐢 Turtle League 2026<\u002Fspan>\n      <div style=\"display: flex; gap: 20px; flex-wrap: wrap;\">\n        <a href=\"index.html\" style=\"color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;\">About<\u002Fa>\n        <a href=\"leaderboard.html\" style=\"color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;\">Stats<\u002Fa>\n        <a href=\"schedule.html\" style=\"color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;\">Schedule<\u002Fa>\n        <a href=\"teams.html\" style=\"color: #666; font-size: 12px; text-decoration: none; letter-spacing: 0.8px; text-transform: uppercase;\">Teams<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"font-size: 12px; color: #444;\">© 2026 Prospect Park Soccer<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1200}}\">\nclass Component extends DCLogic {\n  state = { menuOpen: false, rosterOpen: false, freeAgentOpen: false };\n\n  CC = { Orange: 'tc-orange', Blue: 'tc-blue', White: 'tc-white', Green: 'tc-green' };\n\n  SCHEDULE = [\n    {\n      gameDay: 1, date: \"Wed, June 10\", isCompleted: true,\n      slots: [\n        { time: \"6:30 PM\", games: [\n          { field: 1, team1: \"Blue\", team2: \"Orange\", score: \"2 – 0\" },\n          { field: 2, team1: \"White\", team2: \"Green\", score: \"3 – 0\" }\n        ]},\n        { time: \"7:30 PM\", games: [\n          { field: 1, team1: \"Blue\", team2: \"Green\", score: \"2 – 1\" },\n          { field: 2, team1: \"Orange\", team2: \"White\", score: \"2 – 1\" }\n        ]}\n      ]\n    },\n    {\n      gameDay: 2, date: \"Wed, June 17\", isCompleted: true,\n      slots: [\n },\n          { field: 2, team1: \"White\", team2: \"Green\" }\n        ]}\n      ]\n    },\n    {\n      gameDay: 6, date: \"Tues, July 21\",\n      luma: \"https://luma.com/bpmcrn8k\",\n      meetup: \"https://www.meetup.com/prospect-park-soccer/events/315221591/\",\n      slots: [\n        { time: \"6:30 PM\", games: [\n          { field: 1, team1: \"Orange\", team2: \"White\" },\n          { field: 2, team1: \"Blue\", team2: \"Green\" }\n        ]},\n        { time: \"7:30 PM\", games: [\n          { field: 1, team1: \"Orange\", team2: \"Green\" },\n          { field: 2, team1: \"Blue\", team2: \"White\" }\n        ]}\n      ]\n    },\n    {\n      gameDay: \"Playoffs & Finals\", date: \"Tues, July 28\", isPlayoff: true,\n      slots: [\n        { time: \"6:30 PM\", games: [\n          { field: 1, team1: \"(1st Seed)\", team2: \"(4th Seed)\" },\n          { field: 2, team1: \"(2nd Seed)\", team2: \"(3rd Seed)\" }\n        ]},\n        { time: \"7:30 PM\", games: [\n          { field: 1, team1: \"Winner Field 1\", team2: \"Winner Field 2\" }\n        ]}\n      ]\n    }\n  ];\n\n  renderSchedule() {\n    const CC = this.CC;\n    const e = React.createElement;\n    return this.SCHEDULE.map((day, di) => {\n      const done = day.isCompleted || false;\n      const playoff = day.isPlayoff || false;\n      const showRSVP = !playoff && !done;\n      const label = typeof day.gameDay === 'number' ? `Game Day ${day.gameDay}` : day.gameDay;\n\n      return e('div', {\n        key: di,\n        className: playoff ? 'day-playoff' : 'day-normal',\n        style: { marginBottom: 32, paddingLeft: 20 }\n      }, [\n        // Day header\n        e('div', {\n          key: 'hd',\n          style: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 10, marginBottom: 14, paddingBottom: 12, borderBottom: '1px solid #eee' }\n        }, [\n          e('div', { key: 'info' }, [\n            e('span', { key: 'label', style: { fontFamily: \"'Young Serif', serif\", fontSize: 16, fontWeight: 600, color: playoff ? '#d97000' : '#1a1a1a', fontStyle: playoff ? 'italic' : 'normal' } }, label),\n            e('span', { key: 'date', style: { fontSize: 13, color: '#aaa', marginLeft: 10 } }, day.date),\n          ]),\n          showRSVP && e('div', { key: 'btns', style: { display: 'flex', gap: 8, flexWrap: 'wrap' } }, [\n            e('a', { key: 'luma', href: day.luma, target: '_blank', style: { padding: '6px 12px', background: '#1a472a', color: 'white', borderRadius: 4, fontSize: 12, fontWeight: 600, textDecoration: 'none' } }, 'Roster RSVP'),\n            e('a', { key: 'meetup', href: day.meetup, target: '_blank', style: { padding: '6px 12px', background: '#ff5469', color: 'white', borderRadius: 4, fontSize: 12, fontWeight: 600, textDecoration: 'none' } }, 'Free Agent RSVP'),\n          ]),\n        ]),\n        // Time slots\n        ...day.slots.map((slot, si) =>\n          e('div', { key: si, style: { marginBottom: 14 } }, [\n            e('div', { key: 'time', style: { fontSize: 11, fontWeight: 700, letterSpacing: '1px', textTransform: 'uppercase', color: '#bbb', marginBottom: 8 } }, slot.time),\n            ...slot.games.map((game, gi) =>\n              e('div', { key: gi, style: { display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', background: '#fafaf8', borderRadius: 6, marginBottom: 6, fontSize: 14 } },\n                done\n                  ? [\n                      e('span', { key: 't1', className: CC[game.team1] || '', style: { fontWeight: 600 } }, game.team1),\n                      e('span', { key: 'sc', style: { fontWeight: 700, color: '#1a1a1a', margin: '0 6px' } }, game.score),\n                      e('span', { key: 't2', className: CC[game.team2] || '', style: { fontWeight: 600 } }, game.team2),\n                    ]\n                  : [\n                      e('span', { key: 'f', style: { fontSize: 11, color: '#ccc', fontWeight: 600, letterSpacing: '0.5px', textTransform: 'uppercase', width: 52, flexShrink: 0 } }, `Field ${game.field}`),\n                      e('span', { key: 't1', className: CC[game.team1] || '', style: { fontWeight: 600 } }, game.team1),\n                      e('span', { key: 'vs', style: { color: '#ccc', fontSize: 12, margin: '0 4px' } }, 'vs'),\n                      e('span', { key: 't2', className: CC[game.team2] || '', style: { fontWeight: 600 } }, game.team2),\n                    ]\n              )\n            )\n          ])\n        )\n      ]);\n    });\n  }\n\n  renderVals() {\n    const { menuOpen, rosterOpen, freeAgentOpen } = this.state;\n    return {\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      navClass: menuOpen ? 'nav-menu open' : 'nav-menu',\n      toggleRoster: () => this.setState(s => ({ rosterOpen: !s.rosterOpen })),\n      toggleFreeAgent: () => this.setState(s => ({ freeAgentOpen: !s.freeAgentOpen })),\n      rosterOpen,\n      freeAgentOpen,\n      rosterArrow: rosterOpen ? '▲' : '▼',\n      freeAgentArrow: freeAgentOpen ? '▲' : '▼',\n      scheduleContent: this.renderSchedule(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
